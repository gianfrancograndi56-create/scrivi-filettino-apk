name: Compila APK Android Filettino App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica sorgenti
        uses: actions/checkout@v4

      - name: Aggiungi google-services.json se salvato nei Secrets
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        run: |
          PROJECT_DIR=$(dirname "$(find . -maxdepth 3 -name 'settings.gradle' | head -n 1)")
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > "$PROJECT_DIR/app/google-services.json"

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepara Android SDK
        run: |
          SDK_MGR=$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
            "$SDK_MGR" "platforms;android-34" "build-tools;34.0.0" || true
          fi

      - name: Configura Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compila Filettino App APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -maxdepth 3 -name 'settings.gradle' | head -n 1)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "Errore: settings.gradle non trovato nel repository"
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Pubblica filettino-app.apk scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: filettino-app-android-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          retention-days: 90
