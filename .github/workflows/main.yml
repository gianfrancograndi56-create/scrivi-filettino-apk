name: Compila APK Android Filettino App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica sorgenti
        uses: actions/checkout@v4

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configura Android SDK
        uses: android-actions/setup-android@v3

      - name: Configura Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compila Filettino App APK
        run: gradle assembleDebug --no-daemon

      - name: Pubblica filettino-app.apk scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: filettino-app-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
